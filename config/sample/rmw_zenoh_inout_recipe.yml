direction: inout
domain_id: 0
pdu_def_path: config/sample/comm/rmw_zenoh_inout_example/pdudef.json
cache: config/sample/cache/buffer.json
zenoh:
  endpoint: tcp/127.0.0.1:7447
rmw_zenoh_graph:
  enabled: true
  node_namespace: /
  enclave: "%"
  session_id: auto
  node_id: 0
  qos: default
mappings:
  - endpoint:
      robot: StorageDemo
      pdu: sample_state_rx
      direction: in
    ros2:
      topic: /sample_state_rx
      message_type: std_msgs/msg/UInt64
  - endpoint:
      robot: StorageDemo
      pdu: sample_state_tx
      direction: out
    ros2:
      topic: /sample_state_tx
      message_type: std_msgs/msg/UInt64
