name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  migrate-readme-once:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/add-build-manifest-configure-flow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-build-manifest-configure-flow
          fetch-depth: 0

      - name: Restore and refine build configurator
        shell: bash
        run: |
          git show 401bc0192cae3da5a637f9d011822470927f7f82:tools/hako.py > tools/hako.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/hako.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '        "tools": True,\n        "python_import": True,',
              '        "tools": False,\n        "benchmarks": False,\n        "python_import": True,',
          )
          text = text.replace(
              '        "validation": ["tests", "examples", "tools", "python_import"],',
              '        "validation": ["tests", "examples", "tools", "benchmarks", "python_import"],',
          )
          text = text.replace(
              '            f"-DHAKO_PDU_ENDPOINT_BUILD_TOOLS={\'ON\' if cfg[\'validation\'][\'tools\'] else \'OFF\'}",\n',
              '            f"-DHAKO_PDU_ENDPOINT_BUILD_TOOLS={\'ON\' if cfg[\'validation\'][\'tools\'] else \'OFF\'}",\n'
              '            f"-DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS={\'ON\' if cfg[\'validation\'][\'benchmarks\'] else \'OFF\'}",\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/hako.py
          python tools/test_hako.py

      - name: Apply README quick-start migration
        run: python tools/migrate_readme_once.py

      - name: Commit README and configurator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ja.md tools/hako.py
          git commit -m "Document manifest-driven build flow"
          git push origin HEAD:agent/add-build-manifest-configure-flow

  build-manifest:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build prerequisites
        run: python -m pip install --upgrade pip setuptools cffi

      - name: Test build configurator
        run: python tools/test_hako.py

      - name: Resolve default build manifest
        run: python tools/hako.py configure --dry-run

  linux-native:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          echo "deb [trusted=yes] https://hakoniwalab.github.io/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/hakoniwa.list
          sudo apt update
          sudo apt-get install -y g++-12 libgtest-dev cmake libboost-dev
      - name: Update Compiler Alternatives
        run: |
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 12
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Install hakoniwa-core-pro
        run: |
          git clone --recursive https://github.com/hakoniwalab/hakoniwa-core-pro.git
          cd hakoniwa-core-pro
          bash build.bash
          bash install.bash
          echo "/usr/local/hakoniwa/lib" | sudo tee /etc/ld.so.conf.d/hakoniwa.conf
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DHAKO_PDU_ENDPOINT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          LD_LIBRARY_PATH: /usr/local/hakoniwa/lib
        run: ctest --test-dir build --rerun-failed --output-on-failure

  linux-python:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 cmake libboost-dev python3 python3-pip

      - name: Update Compiler Alternatives
        run: |
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 12

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: python3 -m pip install --upgrade pip setuptools wheel cffi

      - name: Build Shared Native Library
        run: |
          cmake -S . -B build-py -DBUILD_SHARED_LIBS=ON -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF
          cmake --build build-py --config Release --target hakoniwa_pdu_endpoint

      - name: Build Python cffi Module
        env:
          HAKO_PDU_ENDPOINT_SHARED_LIB: ${{ github.workspace }}/build-py/src/libhakoniwa_pdu_endpoint.so
          HAKO_PDU_ENDPOINT_LIB_DIR: ${{ github.workspace }}/build-py/src
        run: python3 python/hakoniwa_pdu_endpoint/build_c_endpoint_ffi.py

      - name: Run Linux Python Smoke Tests
        env:
          HAKO_PDU_ENDPOINT_SHARED_LIB: ${{ github.workspace }}/build-py/src/libhakoniwa_pdu_endpoint.so
          HAKO_PDU_ENDPOINT_LIB_DIR: ${{ github.workspace }}/build-py/src
        run: |
          python3 python/test/test_c_endpoint_smoke.py
          python3 python/test/test_endpoint_container_smoke.py

  macos-python:
    runs-on: macos-latest
    steps:
      - name: Install Dependencies
        run: |
          brew update
          brew install cmake boost

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: python -m pip install --upgrade pip setuptools wheel cffi

      - name: Build Shared Native Library
        run: |
          cmake -S . -B build-py -DBUILD_SHARED_LIBS=ON -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF
          cmake --build build-py --config Release --target hakoniwa_pdu_endpoint

      - name: Build Python cffi Module
        env:
          HAKO_PDU_ENDPOINT_SHARED_LIB: ${{ github.workspace }}/build-py/src/libhakoniwa_pdu_endpoint.dylib
          HAKO_PDU_ENDPOINT_LIB_DIR: ${{ github.workspace }}/build-py/src
        run: python python/hakoniwa_pdu_endpoint/build_c_endpoint_ffi.py

      - name: Run macOS Python Smoke Tests
        env:
          HAKO_PDU_ENDPOINT_SHARED_LIB: ${{ github.workspace }}/build-py/src/libhakoniwa_pdu_endpoint.dylib
          HAKO_PDU_ENDPOINT_LIB_DIR: ${{ github.workspace }}/build-py/src
        run: |
          python python/test/test_c_endpoint_smoke.py
          python python/test/test_endpoint_container_smoke.py

  windows-python:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools wheel cffi

      - name: Install vcpkg and Boost Headers
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          & C:\vcpkg\bootstrap-vcpkg.bat
          & C:\vcpkg\vcpkg.exe install boost-asio:x64-windows boost-beast:x64-windows

      - name: Run Windows Python Smoke Tests
        shell: pwsh
        run: >
          .\test-python-win.ps1
          -BuildFirst
          -BuildDirName build-win
          -Configuration Release
          -PythonCommand python
          -ToolchainFile C:\vcpkg\scripts\buildsystems\vcpkg.cmake
          -VcpkgTriplet x64-windows
          -Platform x64
