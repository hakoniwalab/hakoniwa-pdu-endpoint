name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          echo "deb [trusted=yes] https://hakoniwalab.github.io/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/hakoniwa.list
          sudo apt update
          sudo apt-get install -y g++-12 libgtest-dev cmake libboost-dev
      - name: Update Compiler Alternatives
        run: |
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 12
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Install hakoniwa-core-pro
        run: |
          git clone --recursive https://github.com/hakoniwalab/hakoniwa-core-pro.git
          cd hakoniwa-core-pro
          bash build.bash
          bash install.bash
          echo "/usr/local/hakoniwa/lib" | sudo tee /etc/ld.so.conf.d/hakoniwa.conf
          sudo ldconfig

      - name: Configure
        run: cmake -S . -B build -DHAKO_PDU_ENDPOINT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          LD_LIBRARY_PATH: /usr/local/hakoniwa/lib
        run: ctest --test-dir build --rerun-failed --output-on-failure

  build-zenoh:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          echo "deb [trusted=yes] https://hakoniwalab.github.io/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/hakoniwa.list
          sudo apt update
          sudo apt-get install -y g++-12 libgtest-dev cmake libboost-dev curl pkg-config

      - name: Update Compiler Alternatives
        run: |
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 12

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Build and Install hakoniwa-core-pro
        run: |
          git clone --recursive https://github.com/hakoniwalab/hakoniwa-core-pro.git
          cd hakoniwa-core-pro
          bash build.bash
          bash install.bash
          echo "/usr/local/hakoniwa/lib" | sudo tee /etc/ld.so.conf.d/hakoniwa.conf
          sudo ldconfig

      - name: Configure Zenoh Build
        run: |
          cmake -S . -B build-zenoh \
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=ON \
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=ON \
            -DHAKO_PDU_ENDPOINT_ENABLE_ZENOH=ON \
            -DZENOHC_CARGO_CHANNEL=+1.85.0

      - name: Build Zenoh
        run: cmake --build build-zenoh -j4
