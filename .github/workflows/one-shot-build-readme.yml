name: One-shot build README migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-readmes:
    if: github.event.pull_request.head.ref == 'agent/add-build-manifest-configure-flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-build-manifest-configure-flow

      - name: Update build quick starts
        shell: python
        run: |
          from pathlib import Path

          english = Path("README.md")
          text = english.read_text(encoding="utf-8")
          start = text.index("## Quick Start: Build and Install\n")
          end = text.index("\n## For Developers and Advanced Users\n", start)
          replacement = '''## Quick Start: Manifest-driven build

          The recommended developer flow is the same on Windows, macOS, and Linux. Start by declaring the capabilities you want in `hakoniwa-build.yaml`, then let the configurator resolve CMake options and platform-specific prerequisites.

          The default manifest builds the Python/cffi binding and keeps Hakoniwa Core, Zenoh, and MQTT disabled. These capabilities are independent: enable only what your application needs.

          ### 1. Install the common prerequisites

          Install a C++20 compiler, CMake, and Python 3. When `bindings.python: true`, install the Python build prerequisites:

          ```bash
          python -m pip install --upgrade pip setuptools cffi
          ```

          On Windows, Boost.Asio/Boost.Beast are commonly provided through vcpkg. The configurator detects `VCPKG_ROOT` / `VCPKG_INSTALLATION_ROOT` when available.

          ### 2. Select capabilities in `hakoniwa-build.yaml`

          The default is:

          ```yaml
          bindings:
            python: true

          features:
            hakoniwa_core: false
            zenoh: false
            mqtt: false
          ```

          Common changes:

          - C++ only: set `bindings.python: false`
          - SHM or Hakoniwa time source: set `features.hakoniwa_core: true` and provide `paths.hakoniwa_core_root` (or `HAKONIWA_CORE_ROOT`)
          - Zenoh: set `features.zenoh: true`
          - MQTT: set `features.mqtt: true`

          Python/cffi is a language binding; it does not imply Hakoniwa Core. TCP/UDP/WebSocket/Storage and Zenoh can be used without Hakoniwa Core.

          ### 3. Inspect and build

          ```bash
          python tools/hako.py doctor
          python tools/hako.py configure --dry-run
          python tools/hako.py build
          python tools/hako.py test
          ```

          The resolver writes `.hako/resolved-build.yaml` and `.hako/cmake-args.txt`. Include these when reporting a build/configuration problem so the resolved feature set is reproducible.

          For the dependency model, manifest schema, and migration strategy, see [Build Architecture](docs/build-architecture.md).

          Existing `build.bash`, `build-win.ps1`, `build-python.bash`, `build-python-win.ps1`, and direct CMake commands remain supported as compatibility/advanced developer paths while the manifest flow is adopted.
'''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          english.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          japanese = Path("README.ja.md")
          text = japanese.read_text(encoding="utf-8")
          start = text.index("## クイックスタート: ビルドとインストール\n")
          end = text.index("\n## 開発者向けガイド\n", start)
          replacement = '''## クイックスタート: Manifest駆動ビルド

          推奨する開発者向けビルドフローは Windows / macOS / Linux で共通です。最初に `hakoniwa-build.yaml` へ必要な機能を宣言し、configureツールにCMakeオプションとOS固有の前提条件を解決させます。

          デフォルトmanifestでは Python/cffi binding を有効にし、Hakoniwa Core / Zenoh / MQTT は無効です。これらは独立した機能軸なので、必要なものだけを有効にします。

          ### 1. 共通の前提条件

          C++20 compiler、CMake、Python 3 を用意します。`bindings.python: true` の場合はPython build依存も入れます。

          ```bash
          python -m pip install --upgrade pip setuptools cffi
          ```

          WindowsではBoost.Asio / Boost.Beastをvcpkgで用意する構成を推奨します。configureツールは `VCPKG_ROOT` / `VCPKG_INSTALLATION_ROOT` を検出します。

          ### 2. `hakoniwa-build.yaml` で機能を選ぶ

          デフォルトは次です。

          ```yaml
          bindings:
            python: true

          features:
            hakoniwa_core: false
            zenoh: false
            mqtt: false
          ```

          代表的な変更:

          - C++だけ使う: `bindings.python: false`
          - SHM / Hakoniwa time sourceを使う: `features.hakoniwa_core: true` とし、`paths.hakoniwa_core_root`（または `HAKONIWA_CORE_ROOT`）を設定
          - Zenohを使う: `features.zenoh: true`
          - MQTTを使う: `features.mqtt: true`

          Python/cffiは言語bindingであり、Hakoniwa Coreとは独立です。TCP/UDP/WebSocket/StorageやZenohだけならHakoniwa Coreは不要です。

          ### 3. 設定確認とビルド

          ```bash
          python tools/hako.py doctor
          python tools/hako.py configure --dry-run
          python tools/hako.py build
          python tools/hako.py test
          ```

          resolverは `.hako/resolved-build.yaml` と `.hako/cmake-args.txt` を出力します。ビルド問題を報告する場合は、これらを添えることで解決済みfeatureやpathを再現できます。

          依存関係モデル、manifest schema、移行方針は [Build Architecture](docs/build-architecture.md) を参照してください。

          既存の `build.bash`、`build-win.ps1`、`build-python.bash`、`build-python-win.ps1`、直接CMakeを使う方法も、互換・高度な開発者向け経路として引き続き利用できます。
'''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          japanese.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

      - name: Commit README migration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-build-readme.yml
          git add README.md README.ja.md
          git commit -m "Document manifest-driven build flow"
          git push origin HEAD:agent/add-build-manifest-configure-flow
