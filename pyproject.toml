[build-system]
requires = ["setuptools>=68", "wheel", "cffi>=1.16"]
build-backend = "setuptools.build_meta"

[project]
name = "hakoniwa-pdu-endpoint"
version = "1.0.0"
description = "Source-tree Python helpers for hakoniwa-pdu-endpoint; native library and cffi runtime are installed separately"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Hakoniwa" }
]
dependencies = [
  "cffi>=1.16"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries"
]

[project.urls]
Homepage = "https://github.com/hakoniwalab/hakoniwa-pdu-endpoint"
Repository = "https://github.com/hakoniwalab/hakoniwa-pdu-endpoint"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["hakoniwa_pdu_endpoint*"]
